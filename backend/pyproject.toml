[project]
name = "appointment-matchmaker-backend"
version = "0.1.0"
description = "FastAPI backend implementing the Appointment Matchmaker openapi.yaml contract, in-memory store, bearer-token auth."
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
