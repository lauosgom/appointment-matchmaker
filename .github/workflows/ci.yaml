name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make install-backend
      - run: make test-backend

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: make test-frontend

  stack-tests:
    name: Compose stack (integration + e2e)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 30
    env:
      COMPOSE_FILES: -f docker-compose.yaml -f docker-compose.ci.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the Docker Compose stack
        run: docker compose $COMPOSE_FILES build

      - name: Start the stack and check it answers
        run: |
          docker compose $COMPOSE_FILES up -d --wait
          # The app has no healthcheck, so --wait returns before it answers: poll.
          # 401 means the API is up (settings need a login).
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/settings || true)
            if [ "$code" = 200 ] || [ "$code" = 401 ]; then echo "App is up (HTTP $code)"; exit 0; fi
            echo "Waiting for the app ($i/60, got '$code')"; sleep 2
          done
          docker compose $COMPOSE_FILES logs app
          exit 1

      - name: Integration tests against the stack's PostgreSQL
        run: |
          docker compose $COMPOSE_FILES exec -T db createdb -U appointment appointment_test
          cd backend && uv sync --locked
          TEST_DATABASE_URL=postgresql://appointment:appointment@localhost:5432/appointment_test uv run pytest

      - name: Stop the stack before the e2e run
        run: docker compose $COMPOSE_FILES down -v

      # The e2e suite starts and removes its own Compose project on port 18000,
      # reusing the image built above.
      - name: End-to-end tests (Playwright)
        env:
          E2E_NO_BUILD: "1"
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Show the stack logs
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color || true

      - name: Clean up
        if: always()
        run: docker compose $COMPOSE_FILES down -v --remove-orphans || true

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [stack-tests]
    # Only main deploys. The GCP trust policy enforces the same rule.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_SERVICE }}
      TAG: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Google Cloud (OIDC, no stored keys)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$SERVICE/app:${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      # Only the image changes: the service's settings, secrets and access stay as
      # deploy.sh set them. --no-traffic keeps users on the current revision until
      # the new one has passed the health check on its own tagged URL.
      - name: Deploy the new revision without traffic
        run: |
          gcloud run deploy "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --image="$IMAGE" --no-traffic --tag="$TAG" --quiet
          URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format=json | python3 -c "import json,sys; print(next(t['url'] for t in json.load(sys.stdin)['status']['traffic'] if t.get('tag')=='$TAG'))")"
          echo "CANDIDATE_URL=$URL" >> "$GITHUB_ENV"

      - name: Health check the new revision
        run: ./deploy/gcp/check-health.sh "$CANDIDATE_URL" 30

      - name: Send traffic to the new revision
        run: |
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --to-latest --quiet

      - name: Validate the live service
        run: |
          URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          ./deploy/gcp/check-health.sh "$URL" 30

      - name: Remove the temporary revision tag
        if: always()
        run: |
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --remove-tags="$TAG" --quiet || true
