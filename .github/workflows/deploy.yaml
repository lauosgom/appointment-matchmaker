name: Deploy

# Reusable: deploys an image that already exists in a registry; it never builds.
# Each GitHub Environment holds its own GCP_* variables, so the same steps deploy
# to independent infrastructure. Called by ci.yaml (dev, with the image its build
# job just pushed) and deploy-prod.yaml (production, promoting the image dev runs).
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (dev or production)
        required: true
        type: string
      image_tag:
        description: Tag (YYYYMMDD-HHMMSS-shortsha) of the image in this environment's registry
        required: false
        type: string
        default: ""
      promote_from_source:
        description: >-
          Instead of image_tag, copy the image the source service (GitHub variable
          GCP_SOURCE_SERVICE, i.e. dev) is serving into this environment's registry
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloud Run (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_SERVICE }}
      REVISION_TAG: ci-${{ github.run_id }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      SOURCE_SERVICE: ${{ vars.GCP_SOURCE_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Google Cloud (OIDC, no stored keys)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check which image to deploy
        env:
          PROMOTE: ${{ inputs.promote_from_source }}
        run: |
          if [ "$PROMOTE" = true ] && [ -z "$IMAGE_TAG" ] && [ -n "$SOURCE_SERVICE" ]; then exit 0; fi
          if [ "$PROMOTE" != true ] && [ -n "$IMAGE_TAG" ]; then exit 0; fi
          echo "Give either image_tag, or promote_from_source with GCP_SOURCE_SERVICE set." >&2
          exit 1

      # Production never builds: it takes the exact image dev is serving, so what
      # was tested and seen running in dev is what goes live. The image is copied
      # into production's own registry (registry to registry, same digest) so
      # production does not depend on dev's repository, which prunes old images.
      - name: Copy the image dev is serving into this registry
        if: inputs.promote_from_source
        run: |
          # The revision that has the traffic, not merely the newest one: a dev
          # deploy that failed its health check leaves a newer revision with none.
          REVISION="$(gcloud run services describe "$SOURCE_SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format=json | python3 -c "import json,sys; t=[x for x in json.load(sys.stdin)['status']['traffic'] if x.get('percent')]; print(max(t, key=lambda x: x['percent'])['revisionName'])")"
          SRC_IMAGE="$(gcloud run revisions describe "$REVISION" --project="$PROJECT_ID" --region="$REGION" \
            --format='value(spec.containers[0].image)')"
          SRC_IMAGE="${SRC_IMAGE%%@*}"
          IMAGE_TAG="${SRC_IMAGE##*:}"
          echo "$SOURCE_SERVICE serves $SRC_IMAGE (revision $REVISION)"
          if ! [[ "$IMAGE_TAG" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]]; then
            echo "Tag '$IMAGE_TAG' is not YYYYMMDD-HHMMSS-shortsha: not a CI-built image, refusing to promote it." >&2
            exit 1
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker buildx imagetools create --tag "$REGION-docker.pkg.dev/$PROJECT_ID/$SERVICE/app:$IMAGE_TAG" "$SRC_IMAGE"

      - name: Resolve the image to deploy
        run: echo "IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$SERVICE/app:$IMAGE_TAG" >> "$GITHUB_ENV"

      # Only the image changes: the service's settings, secrets and access stay as
      # deploy.sh set them. --no-traffic keeps users on the current revision until
      # the new one has passed the health check on its own tagged URL.
      - name: Deploy the new revision without traffic
        run: |
          gcloud run deploy "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --image="$IMAGE" --no-traffic --tag="$REVISION_TAG" --quiet
          URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format=json | python3 -c "import json,sys; print(next(t['url'] for t in json.load(sys.stdin)['status']['traffic'] if t.get('tag')=='$TAG'))")"
          echo "CANDIDATE_URL=$URL" >> "$GITHUB_ENV"

      - name: Health check the new revision
        run: ./deploy/gcp/check-health.sh "$CANDIDATE_URL" 30

      - name: Send traffic to the new revision
        run: |
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --to-latest --quiet

      - name: Validate the live service
        run: |
          URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          ./deploy/gcp/check-health.sh "$URL" 30

      - name: Remove the temporary revision tag
        if: always()
        run: |
          gcloud run services update-traffic "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --remove-tags="$REVISION_TAG" --quiet || true
